name: Python CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          elif [[ -f pyproject.toml ]]; then
            python -m pip install -e .
          fi
          python -m pip install pytest

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run tests when present
        shell: bash
        run: |
          if find . -path './.git' -prune -o -path './.venv' -prune -o -type f \\( -name 'test_*.py' -o -name '*_test.py' \\) -print -quit | grep -q .; then
            if python -m pytest -q; then
              :
            else
              pytest_status=$?
              if [[ "$pytest_status" -eq 5 ]]; then
                echo "No Python tests were collected; compile check completed."
              else
                exit "$pytest_status"
              fi
            fi
          else
            echo "No Python test files found; compile check completed."
          fi
