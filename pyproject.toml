[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-soc-workbench"
version = "0.1.0"
description = "A defensive SOC detection and incident-correlation starter"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
soc-lab = "soc_lab.cli:main"
soc-dashboard = "soc_lab.dashboard:main"

[tool.setuptools]
packages = ["soc_lab"]

[tool.setuptools.package-data]
soc_lab = ["assets/*", "static/*"]
